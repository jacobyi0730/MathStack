  difficulty: 1
  format: choice
  stem: 전체를 똑같이 4칸으로 나눴을 때 1칸은 전체의 얼마인가요?
  choices:
  - 1/4
  - 1/3
  - 2/4
  - 4/1
  answer: 1/4
  distractorReason:
  - 정답
  - 칸 수를 잘못 셈
  - 색칠된 칸과 전체 칸을 함께 셈
  - 분자와 분모를 거꾸로 씀
